<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Papa ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="emoji">
            ⚽🥺
        </div>

        <h1 id="text">
            Papa ❤️<br>
            <span>Ek choti si request hai 🥹</span>
        </h1>

        <p class="message">
            Papa, aap duniya ke sab se ache papa ho ❤️<br>
            Kya aap mujhe ek football jersey dila dein? ⚽🥺
        </p>

        <div class="buttons">

            <button id="yes">
                Haan Papa ❤️
            </button>

            <button id="no">
                Nahi 🥺
            </button>

        </div>

        <div class="footer">
            Made with love for the best Papa 🌸
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
